services:
  backend:
    build: ./backend
    container_name: ai-skin-lab-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      EXCEL_PATH: /app/data/price.xlsx
      IMAGES_DIR: /app/data/images
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
      # EUR -> UAH rate for price sheets denominated in € (e.g. Anubis)
      EUR_RATE: ${EUR_RATE:-48}
      # Telegram bot for orders
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      # live-mounted Excel file and images: edits on the host are picked up
      # by watchdog without restarting the container
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: ai-skin-lab-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
      # keep-alive > docker-proxy idle timeout: stale keep-alive sockets make
      # on-demand RSC navigations stall for many seconds
      KEEP_ALIVE_TIMEOUT: "65000"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
    depends_on:
      backend:
        condition: service_healthy
