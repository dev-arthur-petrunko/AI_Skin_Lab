# AI Skin Lab вЂ” automatic catalog reload (cron)
# Runs every 30 minutes and daily at 09:00 to verify price.xlsx is loaded.
# Watchdog already handles real-time file changes; this provides an audit trail.

SHELL=/bin/bash
PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

*/30 * * * * root cd /app && python3 /app/scripts/reload_catalog.py >> /var/log/catalog_reload.log 2>&1
0 9 * * * root cd /app && python3 /app/scripts/reload_catalog.py >> /var/log/catalog_reload.log 2>&1
